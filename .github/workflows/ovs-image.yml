name: OVS image

# The Open vSwitch node image: on every change to its folder on main it is
# built and published under the Open vSwitch version the Dockerfile pins and
# as :latest. Not tied to releases, the tag is OVS's version, not KubeNDT's.
on:
  push:
    branches: ["main"]
    paths: ["deploy/custom_images/ovs/**", ".github/workflows/ovs-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & publish kubendt-ovs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Open vSwitch version from the Dockerfile
        id: ovs
        run: echo "version=$(sed -n 's/^ARG OVS_VERSION=//p' deploy/custom_images/ovs/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/custom_images/ovs
          push: true
          tags: |
            ghcr.io/emigcm98/kubendt-ovs:${{ steps.ovs.outputs.version }}
            ghcr.io/emigcm98/kubendt-ovs:latest
