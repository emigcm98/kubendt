name: P4 image

# The BMv2 switch node image: on every change to its folder on main it is
# built and published under the bmv2 version the Dockerfile pins and as
# :latest. Not tied to releases, the tag is bmv2's version, not KubeNDT's.
on:
  push:
    branches: ["main"]
    paths: ["deploy/custom_images/p4/**", ".github/workflows/p4-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & publish kubendt-p4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the bmv2 version from the Dockerfile
        id: bmv2
        run: echo "version=$(sed -n 's/^ARG BMV2_VERSION=//p' deploy/custom_images/p4/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/custom_images/p4
          push: true
          tags: |
            ghcr.io/emigcm98/kubendt-p4:${{ steps.bmv2.outputs.version }}
            ghcr.io/emigcm98/kubendt-p4:latest
