name: Toolbox image

# The toolbox the backend injects into pods: :latest on every change to its
# folder on main (what a development backend pulls), the versioned tag comes
# from release.yml with every release.
on:
  push:
    branches: ["main"]
    paths: ["deploy/custom_images/toolbox/**", ".github/workflows/toolbox-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & publish kubendt-toolbox:latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/custom_images/toolbox
          push: true
          tags: ghcr.io/emigcm98/kubendt-toolbox:latest
