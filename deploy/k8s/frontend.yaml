# The UI: nginx serving the build and proxying /api to the backend's Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubendt-frontend
  labels:
    app.kubernetes.io/name: kubendt-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubendt-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubendt-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/emigcm98/kubendt-frontend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: kubendt-backend
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubendt-frontend
  labels:
    app.kubernetes.io/name: kubendt-frontend
spec:
  selector:
    app.kubernetes.io/name: kubendt-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
