# The backend, on its ServiceAccount, with the cluster's own credentials: no
# kubeconfig. Its state lives in the cluster, so the pod keeps nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubendt-backend
  labels:
    app.kubernetes.io/name: kubendt-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubendt-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubendt-backend
    spec:
      serviceAccountName: kubendt-backend
      containers:
        - name: backend
          image: ghcr.io/emigcm98/kubendt-backend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GIN_MODE
              value: release
            # The platform's objects go to the namespace the backend runs in.
            - name: KUBENDT_SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The image names a database for the compose install; here there
            # is nothing to move and the state lives in the cluster.
            - name: KUBENDT_DB_PATH
              value: ""
          # The rest of the backend's variables, made by hand (see
          # doc/DEPLOYMENT.md): the admin password and anything secret in the
          # Secret, the plain settings in the ConfigMap. Both optional; without
          # the password a generated one is printed once in the log. A change
          # takes effect on the next rollout restart, the password only on a
          # cluster with no owner yet.
          envFrom:
            - secretRef:
                name: kubendt-backend-env
                optional: true
            - configMapRef:
                name: kubendt-backend-config
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # The image's home for the user it drops to; nothing lasting goes here.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubendt-backend
  labels:
    app.kubernetes.io/name: kubendt-backend
spec:
  selector:
    app.kubernetes.io/name: kubendt-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
