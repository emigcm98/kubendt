# The UI on a fixed port of every node, for a reverse proxy outside the
# cluster: kubectl apply -f this after the kustomization, and point the proxy
# at <any worker>:30080 (an nginx upstream with two workers survives one
# going down). Replaces the ClusterIP Service of the same name.
apiVersion: v1
kind: Service
metadata:
  name: kubendt-frontend
  namespace: kubendt-system
  labels:
    app.kubernetes.io/name: kubendt-frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kubendt-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
