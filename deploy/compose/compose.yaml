# KubeNDT outside the cluster, on your kubeconfig: the published backend and
# UI images, nothing to compile. The install inside the cluster is deploy/k8s.
#
# Usage, from the directory of this file:
#   1. Make sure your kubeconfig is at ~/.kube/config (it is mounted read-only).
#   2. docker compose up -d
#   3. Open http://localhost
#
# Pin a release with KUBENDT_TAG (defaults to the latest published). Image tags
# are plain semver without the leading "v":
#   KUBENDT_TAG=1.14.0 docker compose up -d
#
# The reference of every variable is doc/DEPLOYMENT.md.

# A fixed project name, so the containers and volumes are named the same
# whatever directory this file sits in.
name: kubendt

services:
  backend:
    image: ghcr.io/emigcm98/kubendt-backend:${KUBENDT_TAG:-latest}
    environment:
      - GIN_MODE=release
      # Where the server reads the kubeconfig, a copy the entrypoint makes of
      # the mount at every start.
      - KUBECONFIG=/data/.kube/config
      - FILES_BASE_PATH=/app/files
      - KUBENDT_DB_PATH=/data/kubendt.db
      # The admin's password at the first start on a cluster, ignored after
      # that. CHANGE THIS before any real deployment.
      - KUBENDT_ADMIN_PASSWORD=admin123
    volumes:
      - kubendt-files:/app/files
      - backend-db:/data
      - ~/.kube/config:/kube/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: ghcr.io/emigcm98/kubendt-frontend:${KUBENDT_TAG:-latest}
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
  kubendt-files:
