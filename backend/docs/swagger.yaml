      - description: Interface name (e.g. eth1)
        in: path
        name: interface
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.QdiscResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Show Qdisc (TC) info
      tags:
      - pods
  /readyz:
    get:
      description: Returns readiness state for backend dependencies such as database
        and Kubernetes clients.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/types.ReadinessResponse'
      summary: Readiness check
      tags:
      - system
  /shell/ws/{namespace}/{podName}:
    get:
      description: 'Opens a WebSocket connection providing an interactive shell inside
        a pod. Query parameter `mode` controls shell type: `auto` (default), `sh`,
        or `serial`.'
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Pod name
        in: path
        name: podName
        required: true
        type: string
      - default: auto
        description: 'Shell mode: auto|sh|serial'
        enum:
        - auto
        - sh
        - serial
        in: query
        name: mode
        type: string
      responses: {}
      summary: Interactive shell (WebSocket)
      tags:
      - shell
  /trace/run/{namespace}/{podName}:
    get:
      description: Runs a traceroute (or mtr when metrics=1) from a source pod toward
        an IP or hostname and returns the whole result as one JSON document, each
        hop resolved to a topology node. Blocks until the probe finishes. The source
        node must be L3-capable. The probe runs in a shared debug container in the
        pod, so the pod image needs no traceroute of its own. A live animated version
        streams the same hops over WebSocket at /trace/ws/{namespace}/{podName}.
      parameters:
      - description: Namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: Source pod (base name or indexed pod name); must be L3-capable
        in: path
        name: podName
        required: true
        type: string
      - description: Destination IPv4 address or hostname
        in: query
        name: dest
        required: true
        type: string
      - description: 'Probe method: icmp (default), udp or tcp'
        in: query
        name: method
        type: string
      - description: Set 1 for metrics mode (mtr latency/loss) instead of a plain
          traceroute
        in: query
        name: metrics
        type: integer
      - description: mtr probe rounds (metrics mode only; default 5)
        in: query
        name: cycles
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.TraceReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Traceroute / metrics report
      tags:
      - trace
  /version:
    get:
      description: Returns service name and build metadata.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.VersionResponse'
      summary: Service version
      tags:
      - system
schemes:
- http
swagger: "2.0"
