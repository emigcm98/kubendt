  types.WarningDoc:
    properties:
      detail:
        example: File "web-server/index.html" not found in namespace file manager.
          Mount skipped, the pod will start without it.
        type: string
      file:
        example: web-server/index.html
        type: string
      kind:
        example: mount_file_missing
        type: string
      node:
        example: web-server
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for KubeNDT (Kubernetes Network Digital Twin).
  title: KubeNDT API
  version: annotation and never changes between releases.
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges the admin password for an HttpOnly session cookie.
      parameters:
      - description: Admin password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current session and clears the cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.AuthStatus'
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      description: Reports whether auth is enabled and whether the caller is authenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.AuthStatus'
      summary: Current auth state
      tags:
      - auth
  /auth/tokens:
    get:
      description: Lists API token metadata (never the secrets). Requires a session
        or the admin password.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.APITokenList'
      summary: List API tokens
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Mints a long-lived bearer token (returned only once). Requires
        a session or the admin password (not another token).
      parameters:
      - description: Token name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.CreateTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.CreateTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Create an API token
      tags:
      - auth
  /auth/tokens/{id}:
    delete:
      description: Revokes an API token by id. Requires a session or the admin password.
      parameters:
      - description: Token id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Revoke an API token
      tags:
      - auth
  /capture/clear/{namespace}/{podName}/{container}:
    post:
      description: Empties a stopped capture's pcap so a later export starts fresh.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Pod name
        in: path
        name: podName
        required: true
        type: string
      - description: Capture container id
        in: path
        name: container
        required: true
        type: string
      - description: Capture run id
        in: query
        name: pcap
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Clear capture pcap
      tags:
      - capture
  /capture/packet/{namespace}/{podName}/{container}/{num}:
    get:
      description: Re-dissects a single packet from a capture's pcap into a full JSON
        protocol tree (Wireshark's own dissection via tshark -T json).
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Pod name
        in: path
        name: podName
        required: true
        type: string
      - description: Capture container id
        in: path
        name: container
        required: true
        type: string
      - description: Frame number
        in: path
        name: num
        required: true
        type: integer
      - description: Capture run id
        in: query
        name: pcap
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Wireshark JSON dissection
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Packet dissection
      tags:
      - capture
  /capture/pcap/{namespace}/{podName}/{container}:
    get:
      description: Streams the pcap a capture run wrote, as a file download. Without
        `frames` it returns the whole capture; with `frames` (a comma list of numbers/ranges,
        e.g. 1-5,9,12-20) it returns only those packets (used to export the current
        display filter).
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Pod name
        in: path
        name: podName
        required: true
        type: string
      - description: Capture container id
        in: path
        name: container
        required: true
        type: string
      - description: Capture run id
        in: query
        name: pcap
        required: true
        type: string
      - description: Frame numbers/ranges to export (e.g. 1-5,9,12-20)
        in: query
        name: frames
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Download capture pcap
      tags:
      - capture
  /capture/ws/{namespace}/{podName}/{interface}:
    get:
      description: Injects an ephemeral tshark container into the pod (sharing its
        network namespace) and streams a live capture of one interface. Control frames
        are JSON ({type:"meta"|"status"|"error"}); every other text frame is one packet
        row as tab-separated Wireshark columns (No, Time, Source, Destination, Protocol,
        Length, Info). Closing the socket stops the capture. Optional `filter` is
        a BPF capture filter; optional `container` reuses an existing capture container
        on reconnect.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Pod name
        in: path
        name: podName
        required: true
        type: string
      - description: Interface to capture (e.g. eth1)
        in: path
        name: interface
        required: true
        type: string
      - description: BPF capture filter
        in: query
        name: filter
        type: string
      - description: Existing capture container to reuse
        in: query
        name: container
        type: string
      responses: {}
      summary: Live packet capture (WebSocket)
      tags:
      - capture
  /cluster/nodes/{name}:
    get:
      description: 'Returns the full kubectl-derivable view of a single node: pod
        CIDR, addresses, OS info, kubelet/runtime versions, capacity vs allocatable,
        conditions, taints, labels and annotations. Live usage is included when metrics-server
        is reachable.'
      parameters:
      - description: Node name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.NodeDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get a node's detailed info
      tags:
      - cluster
  /cluster/status:
    get:
      description: Returns connection status and node info for the Kubernetes cluster.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ClusterStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get cluster status
      tags:
      - cluster
  /drivers/:
    get:
      description: Returns all registered KubeNDT drivers (e.g. linux-switch, ovs-switch,
        frr-router).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.DriversListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: List available drivers
      tags:
      - drivers
  /drivers/{driver}:
    get:
      description: Returns the full info (type, executor, capabilities and interface-name
        constraints) for one registered driver. Same per-item shape used by `GET /drivers/`.
      parameters:
      - description: Driver name
        in: path
        name: driver
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.DriverInfo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Get a single driver
      tags:
      - drivers
  /drivers/history/{id}:
    delete:
      description: Removes a single persisted driver operation from history using
        its unique operation ID.
      parameters:
      - description: Operation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.DeleteDriverHistoryByIDResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Delete one persisted driver operation by ID
      tags:
      - drivers
  /drivers/history/{namespace}:
    get:
      description: Returns all persisted driver operations for the namespace across
        all pods in execution order (oldest first). Each entry includes action payload,
        execution timestamp, pod name, and equivalent shell commands reconstructed
        from current driver capabilities when available.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.NamespaceDriverHistoryResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: List persisted driver history by namespace
      tags:
      - drivers
  /drivers/history/{namespace}/{podName}:
    get:
      description: Returns persisted driver operations for a resolved pod in a namespace
        (supports base name and indexed pod name). Entries are ordered by insertion
        time and include action payload, timestamp, and reconstructed equivalent shell
        commands.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Pod reference (e.g. router1 or router1-0)
        in: path
        name: podName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.PodDriverHistoryResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: List persisted driver history by pod
      tags:
      - drivers
  /drivers/history/namespace/{namespace}:
    delete:
      description: Deletes all persisted driver operations across all pods in the
        namespace.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.DeleteNamespaceDriverHistoryResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Delete persisted driver history for a namespace
      tags:
      - drivers
  /drivers/history/namespace/{namespace}/pod/{podName}:
    delete:
      description: Deletes all persisted driver operations for one resolved pod in
        a namespace (supports base name and indexed pod name).
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Pod reference (e.g. router1 or router1-0)
        in: path
        name: podName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.DeletePodDriverHistoryResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Delete persisted driver history for one pod
      tags:
      - drivers
  /file-ops/{namespace}/export:
    get:
      description: Downloads all files for a namespace as a .zip archive.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: ZIP archive
          schema:
            type: file
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorResponse'
      summary: Export as ZIP
      tags:
      - files
  /file-ops/{namespace}/folder:
    post:
      consumes:
      - application/json
      description: Creates a new directory inside namespace file storage.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Folder path to create
        in: body
        name: body
