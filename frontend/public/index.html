<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/kubendt-logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KubeNDT frontend" />
    <title>KubeNDT</title>
    <script>
      // The theme before the app draws, so a dark page never flashes light:
      // the one chosen in this browser, otherwise the system's.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('kubendt.theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          t = dark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
